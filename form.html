<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulir Pendaftaran Kursus</title>
    <div class="form">
        <h2>Form Pendaftaran Kursus</h2>

        <form id="formKursus">
            <label for="nama">Nama</label>
            <input type="text" id="nama" required>

            <label for="email">Email</label>
            <input type="email" id="email" required>

            <label for="tanggal">Tanggal Lahir</label>
            <input type="date" id="tanggal" required>

            <label for="gambar">Upload foto ktp/pelajar </label>
            <input type="file" id="gambar" required>

            <label for="kursus">Kursus</label>
            <select id="kursus" required>
                <option value="">Pilih Kursus</option>
                <option value="Matematika">Matematika</option>
                <option value="Bahasa Inggris">Bahasa Inggris</option>
                <option value="IT">IT</option>
            </select>

            <label for="alasan">Alasan Mendaftar</label>
            <textarea id="alasan" required></textarea>

            <button type="submit">Kirim</button>
        </form>
    </div>

    <footer>Learn Anytime. Anywhere</footer>

    <script src="app.js"></script>
</body>
</html>
