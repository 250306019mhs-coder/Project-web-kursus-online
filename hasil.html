<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hasil Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hasil">
        <h2>Pendaftaran Berhasil!</h2>

        <p>Nama: <span id="nama"></span></p>
        <p>Email: <span id="email"></span></p>
        <p>Tanggal Lahir: <span id="tanggal"></span></p>
        <p>Kursus: <span id="kursus"></span></p>
        <p>Foto KTP/Pelajar: <span id="gambar"></span></p>
        <p>Alasan: <span id="alasan"></span></p>

        <button onclick="window.location.href='project.html'">Kembali</button>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);

        document.getElementById("nama").textContent = params.get("nama");
        document.getElementById("email").textContent = params.get("email");
        document.getElementById("tanggal").textContent = params.get("tanggal");
        document.getElementById("kursus").textContent = params.get("kursus");
        document.getElementById("gambar").textContent = params.get("gambar");
        document.getElementById("alasan").textContent = params.get("alasan");
    </script>
</body>
</html>
